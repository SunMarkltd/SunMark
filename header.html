<style>
.site-header {
  position: sticky;
  top: 0;
  z-index: 999;
  height: 150px;
  display: flex;
  align-items: center;
  padding: 0 55px;
  background: #fff;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
  border-bottom: 1px solid #eee;
}

.header-logo {
  width: 260px;
}

.header-logo img {
  width: 150px;
  height: auto;
  display: block;
}

.header-nav {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 42px;
  align-items: center;
}

.header-nav a {
  position: relative;
  text-decoration: none;
  color: #000;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.header-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -8px;
  width: 0;
  height: 2px;
  background: #008000;
  transition: width 0.3s ease;
}

.header-nav a:hover::after {
  width: 100%;
}

.header-nav a:hover {
  color: #008000;
}

.header-search {
  width: 80px;
  display: flex;
  justify-content: flex-end;
}

.header-search span {
  width: 25px;
  height: 25px;
  border: 2px solid #000;
  border-radius: 50%;
  display: inline-block;
  position: relative;
}

.header-search span::after {
  content: "";
  width: 14px;
  height: 2px;
  background: #000;
  position: absolute;
  right: -10px;
  bottom: -5px;
  transform: rotate(45deg);
}

.menu-toggle {
  display: none;
  font-size: 32px;
  background: none;
  border: none;
  cursor: pointer;
}

/* Mobile */
@media (max-width: 900px) {
  .site-header {
    height: 100px;
    padding: 0 22px;
    justify-content: space-between;
  }

  .header-logo {
    width: auto;
  }

  .header-logo img {
    width: 110px;
  }

  .menu-toggle {
    display: block;
  }

  .header-search {
    display: none;
  }

  .header-nav {
    position: absolute;
    top: 100px;
    left: 0;
    right: 0;
    background: #fff;
    display: none;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
  }

  .header-nav.active {
    display: flex;
  }

  .header-nav a {
    width: 100%;
    text-align: center;
    padding: 18px 0;
    font-size: 17px;
    border-bottom: 1px solid #eee;
  }

  .header-nav a::after {
    display: none;
  }
}
</style>

<header class="site-header">
  <div class="header-logo">
    <a href="index.html">
      <img src="logo.png" alt="Sun Mark Logo">
    </a>
  </div>

  <button class="menu-toggle" onclick="toggleMenu()">☰</button>

  <nav class="header-nav" id="headerNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="brands.html">Brands</a>
    <a href="products.html">Products</a>
    <a href="promotions.html">Promotions</a>
    <a href="logistics.html">Logistics</a>
    <a href="partnerships.html">Partnerships</a>
  </nav>

  <div class="header-search">
    <span></span>
  </div>
</header>

<script>
function toggleMenu() {
  document.getElementById("headerNav").classList.toggle("active");
}
</script>
